name: Build and package binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.2'

    - name: Install Boost (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-all-dev rpm

    - name: Install Boost (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install boost-msvc-14.3 --yes --no-progress
        $boostRoot = Get-ChildItem 'C:\local' -Directory -Filter 'boost_*' |
          Sort-Object Name -Descending |
          Select-Object -First 1
        if (-not $boostRoot) {
          throw 'Boost installation directory not found under C:\local'
        }
        "BOOST_ROOT=$($boostRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Package Debian (.deb)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -eux
        VERSION="${GITHUB_REF_NAME#v}"
        if [ -z "${VERSION}" ] || [ "${VERSION}" = "${GITHUB_REF_NAME}" ]; then
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
        fi

        mkdir -p package-root/DEBIAN dist

        DESTDIR="$PWD/package-root" cmake --install "${{ steps.strings.outputs.build-output-dir }}" --prefix /usr --strip --config "${{ matrix.build_type }}"

        test -x package-root/usr/bin/SudokuCube

        cat > package-root/DEBIAN/control <<EOF
        Package: sudokucube
        Version: ${VERSION}
        Section: games
        Priority: optional
        Architecture: amd64
        Maintainer: SudokuCube maintainers <maintainers@example.com>
        Depends: libc6 (>= 2.31), libstdc++6 (>= 10), libqt6core6 (>= 6.2), libqt6gui6 (>= 6.2), libqt6qml6 (>= 6.2), libqt6quick6 (>= 6.2)
        Description: Interactive Sudoku Cube (Molecube) explorer
         Explore and analyze Sudoku Cube solutions with a Qt Quick UI.
        EOF

        dpkg-deb --build package-root "dist/SudokuCube_${VERSION}_amd64.deb"

        RPM_VERSION="${VERSION//-/_}"
        mkdir -p rpm/SPECS rpm/SOURCES rpm/BUILD rpm/RPMS rpm/SRPMS rpm/BUILDROOT
        tar -C package-root -czf rpm/SOURCES/sudokucube-root.tar.gz usr

        cat > rpm/SPECS/sudokucube.spec <<EOF
        Name: sudokucube
        Version: ${RPM_VERSION}
        Release: 1%{?dist}
        Summary: Interactive Sudoku Cube (Molecube) explorer
        License: BSL-1.0
        URL: https://github.com/${GITHUB_REPOSITORY}
        BuildArch: x86_64
        Source0: sudokucube-root.tar.gz

        %description
        Explore and analyze Sudoku Cube solutions with a Qt Quick UI.

        %prep
        %setup -q -c -T
        tar -xzf %{SOURCE0} -C .

        %build

        %install
        mkdir -p %{buildroot}
        cp -a * %{buildroot}/

        %files
        /usr/bin/SudokuCube

        %changelog
        * Thu Apr 30 2026 SudokuCube CI <maintainers@example.com> - ${RPM_VERSION}-1
        - Automated CI build
        EOF

        rpmbuild --define "_topdir $PWD/rpm" -bb rpm/SPECS/sudokucube.spec
        cp rpm/RPMS/x86_64/*.rpm dist/

    - name: Upload Debian artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: SudokuCube-debian-package
        path: dist/*.deb

    - name: Upload Fedora artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: SudokuCube-fedora-package
        path: dist/*.rpm

    - name: Package Windows (zip)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME -replace '^v', ''
        if ([string]::IsNullOrWhiteSpace($version) -or $version -eq $env:GITHUB_REF_NAME) {
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
        }

        $exeCandidates = Get-ChildItem "${{ steps.strings.outputs.build-output-dir }}" -Recurse -Filter "SudokuCube.exe"
        $exe = $exeCandidates | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
        if (-not $exe) {
          $exe = $exeCandidates | Select-Object -First 1
        }
        if (-not $exe) {
          throw "SudokuCube.exe not found"
        }

        $bundleDir = "dist/SudokuCube-win64"
        New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
        Copy-Item $exe.FullName "$bundleDir/SudokuCube.exe"

        windeployqt --release --qmldir "${{ github.workspace }}/src" "$bundleDir/SudokuCube.exe"

        Compress-Archive -Path "$bundleDir/*" -DestinationPath "dist/SudokuCube_${version}_win64.zip" -Force

    - name: Upload Windows artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: SudokuCube-windows-package
        path: dist/*.zip
